plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Versao vem do CI (numero do run). Local cai no default 1 / 1.0.
def bfVersionCode = (System.getenv("BF_VERSION_CODE") ?: "1").toInteger()
def bfVersionName = System.getenv("BF_VERSION_NAME") ?: "1.0"

android {
    namespace 'com.bffx.bfmidi'
    // Play Store: apps novos precisam mirar a API do Android do ano anterior
    // (36 = Android 16 desde 31/ago/2026). compileSdk 36 exige AGP >= 8.9.1
    // (ver build.gradle da raiz) e Gradle 8.11.1 (ver o workflow).
    compileSdk 36

    defaultConfig {
        applicationId "com.bffx.bfmidi"
        minSdk 24
        // targetSdk 35+ = edge-to-edge OBRIGATORIO (e no 36 sem opt-out): o
        // WebView passa por baixo das barras do sistema. MainActivity recua o
        // root pelas insets — ver o setOnApplyWindowInsetsListener no onCreate.
        targetSdk 36
        versionCode bfVersionCode
        versionName bfVersionName
    }

    // DUAS DISTRIBUICOES, um codigo so:
    //   github — o APK de sideload de sempre (Releases do GitHub). Tem o
    //            atualizador interno (baixa a release nova e instala) e, por
    //            isso, a permissao REQUEST_INSTALL_PACKAGES no manifesto
    //            proprio (src/github/AndroidManifest.xml).
    //   play   — o bundle (.aab) da Play Store. SEM atualizador: a politica
    //            "Device and Network Abuse" proibe app da loja se atualizar por
    //            fora dela, e a permissao de instalar pacotes reprovaria a
    //            revisao. Quem atualiza e a propria Play.
    // O flag SELF_UPDATE e o unico ponto de decisao no codigo (MainActivity).
    flavorDimensions += "dist"
    productFlavors {
        github {
            dimension "dist"
            buildConfigField "boolean", "SELF_UPDATE", "true"
        }
        play {
            dimension "dist"
            buildConfigField "boolean", "SELF_UPDATE", "false"
        }
    }
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Chave de assinatura FIXA commitada no repo (app/bfmidi-release.jks).
            // Todos os builds usam a mesma chave -> o Android aceita instalar a
            // atualizacao por cima sem desinstalar. App pessoal de sideload, entao
            // a senha viver no repo e aceitavel. Envolto em if pra builds locais
            // sem o keystore nao quebrarem a configuracao.
            //
            // Na Play Store esta MESMA chave e a "upload key" do bundle; a chave
            // com que a loja assina o APK entregue ao usuario e decidida uma
            // vez so no Play App Signing (ver PLAY_STORE.md — exportar ESTA chave
            // pra la mantem a assinatura igual a do sideload, e o usuario troca
            // de um pro outro sem desinstalar).
            def ks = file("bfmidi-release.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword "bfmidi123"
                keyAlias "bfmidi"
                keyPassword "bfmidi123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Origem virtual HTTP controlada para os assets do editor. Substitui
    // file:// + allowUniversalAccessFromFileURLs.
    implementation 'androidx.webkit:webkit:1.12.1'
}

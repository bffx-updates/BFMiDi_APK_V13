name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: write       # publicar release + commitar o keystore na 1a vez

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gera a chave de assinatura FIXA na 1a vez e commita de volta no repo.
      # Nas execucoes seguintes o arquivo ja existe e este passo nao faz nada,
      # garantindo que todo APK seja assinado com a MESMA chave (= atualizacao
      # instala por cima sem desinstalar). keytool vem com o JDK acima.
      - name: Ensure fixed signing keystore
        run: |
          KS=app/bfmidi-release.jks
          if [ ! -f "$KS" ]; then
            echo "Keystore ausente — gerando uma vez e commitando."
            keytool -genkeypair -v \
              -keystore "$KS" -storetype JKS \
              -alias bfmidi -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass bfmidi123 -keypass bfmidi123 \
              -dname "CN=BFMiDi, OU=BFFX, O=BFFX, C=BR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KS"
            git commit -m "CI: chave de assinatura fixa do APK [skip ci]"
            git push || echo "AVISO: push do keystore falhou (build segue assinado nesta run)"
          else
            echo "Keystore ja existe — usando o commitado."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # OFFSET DE 1000 — load-bearing na migracao pro repo v13
      # (bffx-updates/BFMiDi_APK_V13, ago/2026). O versionCode vinha de
      # github.run_number CRU, e run_number REINICIA EM 1 num repo novo:
      # o Android recusa instalar por cima de um APK com versionCode MAIOR
      # ("app nao instalado"), entao todo usuario do APK v12 teria que
      # desinstalar antes de atualizar. 1000 > qualquer run_number que o
      # repo antigo (BFMIDI_Android) tenha alcancado, entao o primeiro
      # build daqui ja sai acima do ultimo publicado la.
      # NUNCA baixe este offset — versionCode so pode crescer.
      #
      # A CONTA E FEITA NO SHELL, nao em ${{ }}: expressao de workflow do
      # GitHub NAO tem aritmetica. "${{ 1000 + github.run_number }}" deixou o
      # arquivo INVALIDO ("Unexpected symbol: '+'") e TODO run falhava em 0s,
      # sem job nenhum e sem Release — foi assim que a linha v13 ficou sem APK
      # publicado (runs #1..#8, ago/2026). Exporta pro GITHUB_ENV pra que os
      # passos seguintes (inclusive a tag do Release) usem o MESMO numero.
      - name: Compute version
        run: |
          echo "BF_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "BF_VERSION_NAME=13.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BFMIDI-editor.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BFMIDI-editor-apk
          path: BFMIDI-editor.apk

      # A tag carrega o versionCode (nao o run_number cru): o atualizador
      # interno do APK (MainActivity.checkForUpdate) le o numero DA TAG e
      # compara com o versionCode instalado. Com o offset de 1000, tag=run
      # daria "9 > 1009 = false" e o app NUNCA ofereceria atualizacao.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BF_VERSION_CODE }}
          name: BFMIDI Editor (build ${{ env.BF_VERSION_CODE }})
          files: BFMIDI-editor.apk
